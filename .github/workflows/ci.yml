name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable + dev/web)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check deepthink tests app.py scripts skills

      - name: Ruff format (check only)
        run: ruff format --check deepthink tests app.py scripts skills

      - name: Mypy (typed surface)
        run: >
          mypy --config-file pyproject.toml
          deepthink/config.py deepthink/cli.py deepthink/__main__.py
          deepthink/providers.py deepthink/api.py
          deepthink/cost.py deepthink/sessions.py deepthink/runtime/bus.py

      - name: Ensure env template present for static tests
        run: |
          test -f .env.example
          # Suite accepts .env.example when .env is absent; create empty .env for legacy checks
          if [ ! -f .env ]; then cp .env.example .env; fi

      - name: Full phase test suite (no API keys)
        env:
          # Never require live providers in CI
          OPENROUTER_API_KEY: ""
        run: python tests/run_all.py

      - name: Verify entry points resolve
        run: |
          python -c "from deepthink.config import get_settings; s=get_settings(); print(s.openrouter_model)"
          python -c "from deepthink.cli import main; print('cli ok')"
          python -c "import deepthink; print(deepthink.__version__)"
